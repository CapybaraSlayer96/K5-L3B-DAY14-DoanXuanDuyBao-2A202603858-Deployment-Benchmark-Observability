services:
  - type: web
    name: k5-day14-agent
    runtime: docker
    plan: free
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "10"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: k5-day14-redis
          property: connectionString

  - type: keyvalue
    name: k5-day14-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
